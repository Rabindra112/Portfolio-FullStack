spring.application.name=rabindra-portfolio

# ===============================
# Server
# ===============================
server.port=${PORT:8080}


# ===============================
# MySQL Database
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rabindra_portfolio}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET:change-this-development-secret-key-to-at-least-32-characters}
jwt.expiration=${JWT_EXPIRATION:86400000}


# ===============================
# Gmail SMTP
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===============================
# Frontend / CORS
# ===============================
frontend.url=${FRONTEND_URL:http://localhost:5173}

# ===============================
# Admin
# ===============================
admin.username=${ADMIN_USERNAME:rabindra}
admin.password=${ADMIN_PASSWORD:change-this-admin-password}

# ===============================
# Portfolio Email
# ===============================
portfolio.email=${PORTFOLIO_EMAIL:rabindrakrmahato1123@gmail.com}